<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HiveStream Phase 1B — Native P2P/HLS Correlation Instrument v4a</title>
<!--
  Authorship: William von Meister (Project Owner) + GPT-5.6 Luna / LUNA-HS-001 (AI Collaborator)

  v4a is intentionally NOT a reduced replacement for v4. It loads the COMPLETE v4 instrument
  source, then adds one download control to the existing v4 page. The P2P measurement instrument,
  UI, event logging, native identities, variant control, JSON export, and evidence semantics all
  remain the v4 implementation.

  This is a delivery/export revision only. v4 remains unchanged.
-->
<style>
  html,body { margin:0; padding:0; background:#111; color:#eee; }
  #loader { padding:16px; font:16px system-ui,sans-serif; }
</style>
</head>
<body>
<div id="loader">Loading the complete v4 instrument…</div>
<script>
(function () {
  "use strict";

  var SOURCE = "https://raw.githubusercontent.com/aolcyberchat-gpu/HiveStream-Architecture/main/experiments/phase-1-p2p-proof-instrumented-v4.html";

  function buildDownloadControl() {
    var button = document.createElement("button");
    button.id = "hivestreamV4aDownloadResults";
    button.type = "button";
    button.textContent = "Download Complete JSON Results";
    button.style.cssText = [
      "position:fixed",
      "right:12px",
      "bottom:12px",
      "z-index:2147483647",
      "width:auto",
      "margin:0",
      "padding:12px 16px",
      "border:1px solid #777",
      "border-radius:6px",
      "background:#1c1c1c",
      "color:#eee",
      "font:700 14px system-ui,sans-serif",
      "cursor:pointer",
      "box-shadow:0 2px 10px #000"
    ].join(";");

    button.addEventListener("click", function () {
      var textarea = document.getElementById("jsonExport");
      if (!textarea || !textarea.value) {
        alert("No JSON results are available yet. Run the test first.");
        return;
      }

      var blob = new Blob([textarea.value], { type:"application/json;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url;
      link.download = "hivestream-phase1b-v4a-" + new Date().toISOString().replace(/[:.]/g, "-") + ".json";
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    });

    document.body.appendChild(button);
  }

  fetch(SOURCE, { cache:"no-store" })
    .then(function (response) {
      if (!response.ok) throw new Error("HTTP " + response.status + " while loading v4");
      return response.text();
    })
    .then(function (html) {
      /*
       * Inject the download control into the actual v4 source before replacing this loader page.
       * Nothing from v4 is copied, simplified, or reimplemented here; the complete source is used.
       */
      var injection = "<script>" + buildDownloadControl.toString() + ";buildDownloadControl();<\\/script>";
      html = html.replace("</body>", injection + "</body>");
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function (error) {
      var loader = document.getElementById("loader");
      loader.textContent = "Could not load the complete v4 instrument: " + (error && error.message ? error.message : String(error));
    });
})();
</script>
</body>
</html>
